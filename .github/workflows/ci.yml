name: CI

on:
  push:
    branches:
      - main
      - "week-*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: 0.13.1
          enable-cache: true

      - name: Install the dependencies
        run: uv sync --frozen

      - name: Check the lint rules
        run: uv run ruff check .

      - name: Check the format
        run: uv run ruff format --check .

      - name: Check the OpenAPI snapshot
        run: |
          uv run python scripts/export_openapi.py
          git diff --exit-code openapi.json

      - name: Check the requirements snapshot
        run: |
          uv export --frozen --no-dev --no-hashes --no-emit-project -o requirements.txt
          git diff --exit-code requirements.txt

  test:
    name: Test
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: buildlab_test
          POSTGRES_USER: buildlab
          POSTGRES_PASSWORD: buildlab_dev_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U buildlab -d buildlab_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://buildlab:buildlab_dev_password@localhost:5432/buildlab_test
      SECRET_KEY: ci-secret-key-for-library-api-tests-0101
      ENVIRONMENT: development
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: 0.13.1
          enable-cache: true

      - name: Install the dependencies
        run: uv sync --frozen

      - name: Run the test suite
        run: >-
          uv run pytest
          --cov=src
          --cov-report=term-missing
          --cov-report=xml
          --cov-fail-under=80

      - name: Upload the coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: warn

  docker:
    name: Docker
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: 0.13.1
          enable-cache: true

      - name: Build the image
        run: docker build -t library-api:ci .

  ci:
    name: CI gate
    if: always()
    needs:
      - lint
      - test
      - docker
    runs-on: ubuntu-latest
    steps:
      - name: Fail when a needed job did not succeed
        env:
          LINT_RESULT: ${{ needs.lint.result }}
          TEST_RESULT: ${{ needs.test.result }}
          DOCKER_RESULT: ${{ needs.docker.result }}
        run: |
          failed=0
          for result in "$LINT_RESULT" "$TEST_RESULT" "$DOCKER_RESULT"; do
            if [ "$result" != "success" ]; then
              echo "A needed job did not succeed. Result: $result"
              failed=1
            fi
          done
          if [ "$failed" -ne 0 ]; then
            exit 1
          fi
          echo "Every needed job succeeded."
