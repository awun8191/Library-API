# Watch the production health route. Open one incident issue on failure.
#
# Required repository variables: PRODUCTION_URL.
name: Monitor

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  issues: write
  contents: read

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  health:
    name: Health
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
      ISSUE_TITLE: Production health check failed
    steps:
      - name: Make sure the incident label exists
        run: gh label create incident --color B60205 || true

      - name: Check the production health route
        id: probe
        run: |
          if body=$(curl -fsS --max-time 20 "$PRODUCTION_URL/health"); then
            echo "Health body: $body"
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "The health route did not answer."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update the incident
        if: steps.probe.outputs.ok == 'false'
        run: |
          number=$(gh issue list --label incident --state open --limit 100 \
            --json number,title \
            --jq 'map(select(.title == env.ISSUE_TITLE)) | .[0].number // empty')
          body="The health route at $PRODUCTION_URL/health did not answer. Run: $GITHUB_SERVER_URL/$GH_REPO/actions/runs/$GITHUB_RUN_ID"
          if [ -z "$number" ]; then
            gh issue create --title "$ISSUE_TITLE" --label incident --body "$body"
          else
            gh issue comment "$number" --body "$body"
          fi
          exit 1

      - name: Close the incident
        if: steps.probe.outputs.ok == 'true'
        run: |
          number=$(gh issue list --label incident --state open --limit 100 \
            --json number,title \
            --jq 'map(select(.title == env.ISSUE_TITLE)) | .[0].number // empty')
          if [ -n "$number" ]; then
            gh issue close "$number" --comment "The production health check passed again."
          fi
