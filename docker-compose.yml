services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-buildlab}
      POSTGRES_USER: ${POSTGRES_USER:-buildlab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-buildlab} -d ${POSTGRES_DB:-buildlab}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: