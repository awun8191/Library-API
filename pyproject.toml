[project]
name = "buildlab-library"
version = "0.2.0"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "argon2-cffi>=23.1.0",
    "fastapi[standard]>=0.143.0",
    "pyjwt>=2.9.0",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "sqlalchemy>=2.1.4",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=6.0.0",
    "ruff>=0.9.0",
]

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src", "tests"]
# Migrations are generated files. The scripts use the same rules as the application.
exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI reads the dependency markers from the argument defaults.
extend-immutable-calls = [
    "fastapi.Body",
    "fastapi.Depends",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Header",
    "fastapi.Path",
    "fastapi.Query",
    "fastapi.Security",
]

[tool.ruff.lint.isort]
known-first-party = [
    "core",
    "dependencies",
    "integrations",
    "middleware",
    "modules",
    "schema",
    "tests",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--strict-markers --strict-config"
filterwarnings = [
    "error::DeprecationWarning",
    # Starlette announces a move from httpx to httpx2 in its test client.
    # The API cannot change that library notice, so keep it out of the report.
    "ignore::starlette.exceptions.StarletteDeprecationWarning",
]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "if TYPE_CHECKING:",
    "\\.\\.\\.",
]
